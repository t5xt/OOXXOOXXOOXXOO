<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lil Cenat</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --ink: #fff;
      --muted: #b5b5b5;
      --panel: #000;
      --panel-border: #777;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    main {
      position: relative;
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 1.25rem;
    }

    .entry {
      width: min(760px, 100%);
      text-align: center;
      transition: opacity 700ms ease, transform 700ms ease, filter 700ms ease;
    }

    .entry.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
      filter: blur(10px);
    }

    h1 {
      margin: 0 0 1.45rem;
      font-size: clamp(0.95rem, 2.7vw, 1.55rem);
      font-weight: 400;
      line-height: 1.12;
      letter-spacing: 0;
      text-transform: lowercase;
      text-wrap: balance;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
      margin: 0 auto;
      width: min(230px, 100%);
    }

    .choice {
      min-height: 48px;
      border: 1px solid #777;
      border-radius: 8px;
      background: #000;
      color: #fff;
      cursor: pointer;
      font: 500 clamp(0.8rem, 2.4vw, 0.95rem) / 1 Inter, ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.5px;
      text-transform: lowercase;
      transition: all 250ms cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .choice::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
      transition: left 0.5s;
    }

    .choice:hover::before {
      left: 100%;
    }

    .choice:hover,
    .choice:focus-visible {
      outline: none;
      transform: translateY(-3px) scale(1.02);
      background: #111;
      border-color: #fff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.7);
    }

    .choice:active {
      transform: translateY(-1px) scale(0.98);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    .video-stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: min(4vw, 2rem);
      opacity: 0;
      pointer-events: none;
      background: #000;
      transition: opacity 1200ms ease;
    }

    .video-stage.active {
      opacity: 1;
      pointer-events: auto;
    }

    video {
      width: min(100%, 1120px);
      max-height: 88vh;
      border-radius: 0;
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.65);
      background: #050505;
    }

    .fallback {
      position: absolute;
      bottom: 1.25rem;
      left: 50%;
      width: min(90vw, 520px);
      transform: translateX(-50%);
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
      text-align: center;
      opacity: 0;
      transition: opacity 350ms ease;
    }

    .fallback.visible {
      opacity: 1;
    }

    .jumpscare {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      background: #000;
    }

    .jumpscare.active {
      animation: scareFlash 1800ms steps(1, end) forwards, screenShake 70ms linear 24;
      pointer-events: auto;
    }

    .face {
      position: relative;
      width: min(96vmin, 780px);
      aspect-ratio: 0.72;
      border-radius: 46% 46% 40% 40%;
      background:
        radial-gradient(ellipse at 34% 36%, #000 0 10%, #fff 11% 13%, transparent 14%),
        radial-gradient(ellipse at 66% 36%, #000 0 10%, #fff 11% 13%, transparent 14%),
        radial-gradient(ellipse at 50% 73%, #000 0 17%, #fff 18% 19%, #000 20% 27%, transparent 28%),
        linear-gradient(90deg, transparent 0 40%, rgba(0, 0, 0, 0.45) 41% 43%, transparent 44% 56%, rgba(0, 0, 0, 0.45) 57% 59%, transparent 60%),
        radial-gradient(ellipse at 50% 46%, #f7f7f7 0 44%, #bfbfbf 45% 51%, transparent 52%);
      filter: grayscale(1) contrast(2.4) brightness(1.12);
      transform: scale(0.03) rotate(-18deg);
      box-shadow: 0 0 0 999vmax #000;
    }

    .jumpscare.active .face {
      animation: lunge 1050ms cubic-bezier(.02,1,.05,1) forwards, jitter 45ms linear 28;
    }

    .face::before,
    .face::after {
      content: "";
      position: absolute;
      z-index: -1;
      top: -8%;
      width: 38%;
      height: 118%;
      background:
        linear-gradient(90deg, #000 0 28%, transparent 29% 35%, #000 36% 58%, transparent 59% 68%, #000 69%),
        #000;
      filter: blur(0.5px);
      transform-origin: 50% 0;
    }

    .face::before {
      left: -16%;
      transform: rotate(6deg);
    }

    .face::after {
      right: -16%;
      transform: rotate(-6deg);
    }

    .jumpscare.active .face::before {
      animation: hairLeft 90ms linear 20;
    }

    .jumpscare.active .face::after {
      animation: hairRight 90ms linear 20;
    }

    .quiet-message {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      opacity: 0;
      pointer-events: none;
      background: #000;
      color: #fff;
      font-size: clamp(1.1rem, 4vw, 1.8rem);
      font-weight: 400;
      transition: opacity 700ms ease;
    }

    .quiet-message.active {
      opacity: 1;
      pointer-events: auto;
    }

    .again {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      z-index: 6;
      min-width: 50px;
      min-height: 50px;
      border: 1px solid #777;
      border-radius: 8px;
      background: #000;
      color: #fff;
      cursor: pointer;
      font: 500 1rem Inter, ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.5px;
      opacity: 0;
      pointer-events: none;
      transition: all 250ms cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .again::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
      transition: left 0.5s;
    }

    .again:hover::before {
      left: 100%;
    }

    .again.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .again:hover,
    .again:focus-visible {
      outline: none;
      transform: translateY(-2px) scale(1.05);
      background: #111;
      border-color: #fff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.7);
    }

    .again:active {
      transform: translateY(-1px) scale(0.98);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    .eye-video {
      position: fixed;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
      z-index: 1;
      filter: brightness(1.2) contrast(1.3);
    }

    .hebrew-text {
      position: fixed;
      color: #ff0000;
      font-family: 'Georgia', serif;
      font-size: 20px;
      font-weight: bold;
      font-style: italic;
      text-shadow: 
        0 0 5px #ff0000,
        0 0 10px #ff0000,
        0 0 15px #ff0000,
        0 0 20px #8b0000,
        2px 2px 2px #000000,
        -2px -2px 2px #000000;
      pointer-events: none;
      z-index: 1000;
      opacity: 0;
      animation: scaryTextFade 0.8s forwards, textGlitch 3s infinite;
      transform: skew(-2deg, 1deg);
    }

    @keyframes scaryTextFade {
      0% { 
        opacity: 0; 
        transform: skew(-2deg, 1deg) scale(0.8);
      }
      50% { 
        opacity: 0.7; 
        transform: skew(2deg, -1deg) scale(1.1);
      }
      100% { 
        opacity: 1; 
        transform: skew(-1deg, 0.5deg) scale(1);
      }
    }

    @keyframes textGlitch {
      0%, 100% { 
        text-shadow: 
          0 0 5px #ff0000,
          0 0 10px #ff0000,
          0 0 15px #ff0000,
          0 0 20px #8b0000,
          2px 2px 2px #000000,
          -2px -2px 2px #000000;
      }
      25% { 
        text-shadow: 
          2px 2px 5px #ff0000,
          -2px -2px 10px #ff0000,
          0 0 15px #8b0000,
          0 0 25px #ff0000,
          0 0 2px #000000,
          0 0 2px #000000;
      }
      50% { 
        text-shadow: 
          -2px 0 5px #8b0000,
          2px 0 10px #ff0000,
          0 0 15px #ff0000,
          0 0 20px #8b0000,
          2px 0 2px #000000,
          -2px 0 2px #000000;
      }
      75% { 
        text-shadow: 
          0 2px 5px #ff0000,
          0 -2px 10px #8b0000,
          0 0 15px #ff0000,
          0 0 25px #ff0000,
          0 2px 2px #000000,
          0 -2px 2px #000000;
      }
    }

    .scary-return-message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #ff0000;
      font-family: 'Arial Black', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      text-shadow: 
        0 0 10px rgba(255, 0, 0, 0.8),
        0 0 20px rgba(255, 0, 0, 0.6),
        0 0 30px rgba(255, 0, 0, 0.4),
        2px 2px 4px rgba(0, 0, 0, 0.9);
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      animation: professionalScaryAppear 0.6s forwards;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    @keyframes professionalScaryAppear {
      0% { 
        opacity: 0; 
        transform: translateX(-50%) translateY(-20px);
        filter: blur(5px);
      }
      100% { 
        opacity: 1; 
        transform: translateX(-50%) translateY(0);
        filter: blur(0);
      }
    }

    @keyframes scareFlash {
      0% { opacity: 0; background: #000; }
      2% { opacity: 1; background: #fff; }
      5% { opacity: 1; background: #000; }
      8% { opacity: 1; background: #fff; }
      10% { opacity: 1; background: #000; }
      16% { opacity: 1; background: #fff; }
      19% { opacity: 1; background: #000; }
      32% { opacity: 1; background: #fff; }
      34% { opacity: 1; background: #000; }
      100% { opacity: 1; background: #000; }
    }

    @keyframes lunge {
      0% { transform: scale(0.03) rotate(-18deg); }
      18% { transform: scale(1.9) rotate(9deg); }
      45% { transform: scale(1.25) rotate(-5deg); }
      100% { transform: scale(1.65) rotate(0deg); }
    }

    @keyframes jitter {
      0%, 100% { translate: 0 0; }
      25% { translate: 22px -18px; }
      50% { translate: -26px 15px; }
      75% { translate: 18px 24px; }
    }

    @keyframes screenShake {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-12px, 8px); }
      50% { transform: translate(14px, -10px); }
      75% { transform: translate(-8px, -12px); }
    }

    @keyframes hairLeft {
      0%, 100% { transform: rotate(6deg) translateY(0); }
      50% { transform: rotate(-5deg) translateY(18px); }
    }

    @keyframes hairRight {
      0%, 100% { transform: rotate(-6deg) translateY(0); }
      50% { transform: rotate(5deg) translateY(18px); }
    }

    @media (max-width: 560px) {
      .choices {
        grid-template-columns: 1fr;
      }

      .choice {
        min-height: 42px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="entry" id="entry" aria-labelledby="question">
      <h1 id="question">are you getting back for lil cenat?</h1>
      <div class="choices">
        <button class="choice yes" type="button" id="yes">yes</button>
        <button class="choice no" type="button" id="no">no</button>

    </section>

    <section class="video-stage" id="videoStage" aria-label="video">
      <video id="video" src="yes.mp4" controls playsinline preload="metadata"></video>
      <p class="fallback" id="fallback">The yes.mp4 video could not be loaded.</p>
    </section>

    <audio id="prayAudio" loop>
      <source src="pray.mp3" type="audio/mpeg">
    </audio>

    <div id="eyeContainer"></div>
    <div id="hebrewTextContainer"></div>

    <section class="jumpscare" id="jumpscare" aria-hidden="true">
      <div class="face" aria-hidden="true"></div>
    </section>

    <section class="quiet-message" id="quietMessage" aria-live="polite">
      <div style="text-align: center; display: flex; flex-direction: column; justify-content: center; height: 100vh;">
        <p style="margin: 0; font-size: clamp(1.1rem, 4vw, 1.8rem); font-weight: 400;">why the fuck would you not get back for him? you're such a gay fucking little cunt, fuck up im getting the israelians 🇮🇱 on ur ass</p>
        <div style="margin-top: 2rem;">
          <p style="margin: 0.3rem 0;" id="ipInfo"></p>

          <p style="margin: 0.3rem 0;" id="deviceInfo"></p>
          <p style="margin: 0.3rem 0;" id="browserInfo"></p>

        </div>

    </section>

    <button class="again" type="button" id="again" aria-label="restart">R</button>
  </main>

  <script>
    const entry = document.querySelector("#entry");
    const yes = document.querySelector("#yes");
    const no = document.querySelector("#no");
    const videoStage = document.querySelector("#videoStage");
    const video = document.querySelector("#video");
    const fallback = document.querySelector("#fallback");
    const jumpscare = document.querySelector("#jumpscare");
    const quietMessage = document.querySelector("#quietMessage");
    const again = document.querySelector("#again");
    const prayAudio = document.querySelector("#prayAudio");
    const eyeContainer = document.querySelector("#eyeContainer");
    const hebrewTextContainer = document.querySelector("#hebrewTextContainer");

    let audioContext;
    let scareSources = [];
    let horrorInterval;
    let eyeVideos = [];
    let hebrewTexts = [];
    let returnMessageActive = false;

    const hebrewPhrases = [
      "אין דרך לברוח.",
      "אתה לא הולך לשום מקום.",
      "תנעל את הדלתות.",
      "תבדוק מתחת למיטה.",
      "תסתכל מאחוריך.",
      "הוא כבר בתוך הבית.",
      "מישהו מסתכל עליך עכשיו.",
      "אל תכבה את האור.",
      "שמעת את זה גם, נכון?",
      "אל תענה לדלת.",
      "הוא עומד מאחוריך.",
      "אל תירדם הלילה.",
      "היא מחכה לך בחושך.",
      "החלון לא היה פתוח קודם.",
      "אתה לבד רק כשאתה לא מסתכל.",
      "הוא יודע איפה אתה גר.",
      "אל תסמוך על הקולות.",
      "משהו זז במסדרון.",
      "אם אתה שומע דפיקות — אל תפתח.",
      "היא לא הפסיקה לחייך מאז שראית אותה."
    ];

    function stopScareSound() {
      scareSources.forEach((source) => {
        try {
          source.stop();
        } catch {
        }
      });
      scareSources = [];
    }

    function hideEntry() {
      entry.classList.add("hidden");
    }

    function createEyeVideo() {
      const video = document.createElement('video');
      video.src = 'eye.mp4';
      video.className = 'eye-video';
      video.autoplay = true;
      video.loop = true;
      video.muted = true;
      
      const eyeSize = 200;
      const padding = 50;
      
      function checkEyeCollision(newLeft, newTop) {
        for (let existingEye of eyeVideos) {
          const existingLeft = parseInt(existingEye.style.left);
          const existingTop = parseInt(existingEye.style.top);
          
          if (newLeft < existingLeft + eyeSize + padding &&
              newLeft + eyeSize + padding > existingLeft &&
              newTop < existingTop + eyeSize + padding &&
              newTop + eyeSize + padding > existingTop) {
            return true;           }
        }
        return false;       }
      
      let attempts = 0;
      let left, top;
      
      do {
        const side = Math.random();
        
                if (side < 0.5) {
                    left = Math.random() * Math.max(0, window.innerWidth * 0.15 - eyeSize);
          top = Math.random() * (window.innerHeight - eyeSize);
        } else {
                    left = window.innerWidth * 0.85 + Math.random() * Math.max(0, window.innerWidth * 0.15 - eyeSize);
          top = Math.random() * (window.innerHeight - eyeSize);
        }
        
        left = Math.max(10, Math.min(left, window.innerWidth - eyeSize - 10));
        top = Math.max(10, Math.min(top, window.innerHeight - eyeSize - 10));
        
        attempts++;
      } while (checkEyeCollision(left, top) && attempts < 15);
      
      video.style.left = left + 'px';
      video.style.top = top + 'px';
      eyeContainer.appendChild(video);
      eyeVideos.push(video);
    }

    function createHebrewText() {
      const text = document.createElement('div');
      text.className = 'hebrew-text';
      const phrase = hebrewPhrases[Math.floor(Math.random() * hebrewPhrases.length)];
      
      const textWidth = 300;
      const textHeight = 30;
      const padding = 50;       
      function checkCollision(newLeft, newTop) {
        for (let existingText of hebrewTexts) {
          const existingLeft = parseInt(existingText.style.left);
          const existingTop = parseInt(existingText.style.top);
          
          if (newLeft < existingLeft + textWidth + padding &&
              newLeft + textWidth + padding > existingLeft &&
              newTop < existingTop + textHeight + padding &&
              newTop + textHeight + padding > existingTop) {
            return true;           }
        }
        return false;       }
      
      let attempts = 0;
      let left, top;
      
      do {
        const side = Math.random();
        
        if (side < 0.25) {
          left = Math.random() * Math.max(0, window.innerWidth * 0.3 - textWidth);
          top = Math.random() * Math.max(0, window.innerHeight - textHeight - 100);
        } else if (side < 0.5) {
          left = window.innerWidth * 0.7 + Math.random() * Math.max(0, window.innerWidth * 0.3 - textWidth);
          top = Math.random() * Math.max(0, window.innerHeight - textHeight - 100);
        } else if (side < 0.75) {
          left = Math.random() * Math.max(0, window.innerWidth - textWidth);
          top = Math.random() * Math.max(0, window.innerHeight * 0.2 - textHeight);
        } else {
          left = Math.random() * Math.max(0, window.innerWidth - textWidth);
          top = window.innerHeight * 0.8 + Math.random() * Math.max(0, window.innerHeight * 0.2 - textHeight);
        }
        
        left = Math.max(10, Math.min(left, window.innerWidth - textWidth - 10));
        top = Math.max(10, Math.min(top, window.innerHeight - textHeight - 10));
        
        attempts++;
      } while (checkCollision(left, top) && attempts < 20);
      
      text.style.left = left + 'px';
      text.style.top = top + 'px';
      
      let currentText = '';
      let charIndex = 0;
      const typeInterval = setInterval(() => {
        if (charIndex < phrase.length) {
          currentText += phrase[charIndex];
          text.textContent = currentText;
          charIndex++;
        } else {
          clearInterval(typeInterval);
        }
      }, 50);
      
      hebrewTextContainer.appendChild(text);
      hebrewTexts.push(text);
    }

    function startHorrorEffects() {
      horrorInterval = setInterval(() => {
        if (Math.random() > 0.1) {
          createEyeVideo();
        }
        if (Math.random() > 0.2) {
          createHebrewText();
        }
        
        if (eyeVideos.length > 8) {
          const oldEye = eyeVideos.shift();
          oldEye.remove();
        }
      }, 1200);
    }

    function stopHorrorEffects() {
      clearInterval(horrorInterval);
      eyeVideos.forEach(video => video.remove());
      hebrewTexts.forEach(text => text.remove());
      eyeVideos = [];
      hebrewTexts = [];
    }

    function showScaryReturnMessage() {
      returnMessageActive = true;
      const message = document.createElement('div');
      message.className = 'scary-return-message';
      const fullText = 'THERES NO ESCAPING NOW.';
      message.textContent = '';
      message.style.opacity = '1';
      document.body.appendChild(message);
      
      let currentText = '';
      let charIndex = 0;
      const typeInterval = setInterval(() => {
        if (charIndex < fullText.length) {
          currentText += fullText[charIndex];
          message.textContent = currentText;
          charIndex++;
        } else {
          clearInterval(typeInterval);
        }
      }, 50);
      
      setTimeout(() => {
        message.remove();
        returnMessageActive = false;
      }, 3000);
    }

    function playScareSound() {
      stopScareSound();
      audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
      const now = audioContext.currentTime;
      const duration = 30;
      const master = audioContext.createGain();
      const compressor = audioContext.createDynamicsCompressor();

      compressor.threshold.setValueAtTime(-24, now);
      compressor.knee.setValueAtTime(16, now);
      compressor.ratio.setValueAtTime(12, now);
      compressor.attack.setValueAtTime(0.001, now);
      compressor.release.setValueAtTime(0.16, now);

      master.gain.setValueAtTime(0.0001, now);
      master.gain.exponentialRampToValueAtTime(1, now + 0.018);
      master.gain.setValueAtTime(1, now + 0.05);
      master.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      master.connect(compressor);
      compressor.connect(audioContext.destination);

      const screamFilter = audioContext.createBiquadFilter();
      screamFilter.type = "bandpass";
      screamFilter.frequency.setValueAtTime(1800, now);
      screamFilter.frequency.exponentialRampToValueAtTime(3400, now + 0.22);
      screamFilter.frequency.setValueAtTime(2200, now + 0.5);
      screamFilter.frequency.exponentialRampToValueAtTime(900, now + duration);
      screamFilter.Q.setValueAtTime(18, now);
      screamFilter.connect(master);

      [1220, 1530, 1890].forEach((frequency, index) => {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = index === 1 ? "square" : "sawtooth";
        oscillator.frequency.setValueAtTime(frequency, now);
        oscillator.frequency.exponentialRampToValueAtTime(frequency * 1.9, now + 0.08);
        oscillator.frequency.setValueAtTime(frequency * 1.15, now + 0.5);
        oscillator.frequency.exponentialRampToValueAtTime(frequency * 0.62, now + duration - 0.4);

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.42, now + 0.02 + index * 0.012);
        gain.gain.setValueAtTime(0.42, now + 0.5);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        oscillator.connect(gain);
        gain.connect(screamFilter);
        oscillator.start(now);
        oscillator.stop(now + duration);
        scareSources.push(oscillator);
      });

      const bufferSize = audioContext.sampleRate * duration;
      const noiseBuffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
      const samples = noiseBuffer.getChannelData(0);

      for (let i = 0; i < bufferSize; i += 1) {
        samples[i] = Math.random() * 2 - 1;
      }

      const noise = audioContext.createBufferSource();
      const noiseGain = audioContext.createGain();
      const noiseFilter = audioContext.createBiquadFilter();

      noise.buffer = noiseBuffer;
      noiseFilter.type = "highpass";
      noiseFilter.frequency.setValueAtTime(700, now);
      noiseFilter.frequency.exponentialRampToValueAtTime(120, now + duration - 0.5);
      noiseGain.gain.setValueAtTime(0.0001, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.72, now + 0.012);
      noiseGain.gain.setValueAtTime(0.72, now + 0.5);
      noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(master);
      noise.start(now);
      noise.stop(now + duration);
      scareSources.push(noise);
    }

    yes.addEventListener("click", async () => {
      hideEntry();
      videoStage.classList.add("active");

      try {
        await video.play();
      } catch {
        video.muted = true;
        try {
          await video.play();
        } catch {
          fallback.classList.add("visible");
        }
      }

      again.classList.add("visible");
    });

    video.addEventListener("error", () => {
      fallback.classList.add("visible");
    });

    no.addEventListener("click", () => {
      hideEntry();
      quietMessage.classList.add("active");
      again.classList.add("visible");
      gatherUserInfo();
      prayAudio.currentTime = 2;
      prayAudio.play();
      
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
      } else if (document.documentElement.webkitRequestFullscreen) {
        document.documentElement.webkitRequestFullscreen();
      } else if (document.documentElement.msRequestFullscreen) {
        document.documentElement.msRequestFullscreen();
      }
      
      setTimeout(() => {
        startHorrorEffects();
      }, 1000);
    });

    async function gatherUserInfo() {
      try {
        const ipResponse = await fetch('https://api.ipify.org?format=json');
        const ipData = await ipResponse.json();
        document.getElementById('ipInfo').textContent = `IP Address: ${ipData.ip}`;
        
        try {
          const geoResponse = await fetch(`https://ipinfo.io/${ipData.ip}/json`);
          const geoData = await geoResponse.json();
          
          if (geoData.city && geoData.country) {
            document.getElementById('locationInfo').textContent = `Location: ${geoData.city}, ${geoData.country}`;
          }
          
          if (geoData.loc) {
            const coords = geoData.loc.split(',');
            document.getElementById('coordInfo').textContent = `Coordinates: ${parseFloat(coords[0]).toFixed(4)}° N, ${parseFloat(coords[1]).toFixed(4)}° W`;
          }
        } catch {
        }
      } catch {
        document.getElementById('ipInfo').textContent = '';
      }

      const platform = navigator.platform || 'Unknown';
      const userAgent = navigator.userAgent;
      let deviceType = 'Unknown';
      
      if (/Mobile|Android|iPhone|iPad/i.test(userAgent)) {
        deviceType = 'Mobile Device';
      } else if (/Windows/i.test(userAgent)) {
        deviceType = 'Windows PC';
      } else if (/Mac/i.test(userAgent)) {
        deviceType = 'Mac';
      } else if (/Linux/i.test(userAgent)) {
        deviceType = 'Linux';
      }
      
      document.getElementById('deviceInfo').textContent = `Device: ${deviceType} (${platform})`;

      let browserName = 'Unknown';
      let browserVersion = '';
      
      if (userAgent.indexOf('Chrome') > -1 && userAgent.indexOf('Edg') === -1) {
        browserName = 'Chrome';
        const match = userAgent.match(/Chrome\/(\d+\.\d+\.\d+\.\d+)/);
        browserVersion = match ? match[1] : '';
      } else if (userAgent.indexOf('Safari') > -1 && userAgent.indexOf('Chrome') === -1) {
        browserName = 'Safari';
        const match = userAgent.match(/Version\/(\d+\.\d+)/);
        browserVersion = match ? match[1] : '';
      } else if (userAgent.indexOf('Firefox') > -1) {
        browserName = 'Firefox';
        const match = userAgent.match(/Firefox\/(\d+\.\d+)/);
        browserVersion = match ? match[1] : '';
      } else if (userAgent.indexOf('Edg') > -1) {
        browserName = 'Edge';
        const match = userAgent.match(/Edg\/(\d+\.\d+\.\d+\.\d+)/);
        browserVersion = match ? match[1] : '';
      }
      
      document.getElementById('browserInfo').textContent = `Browser: ${browserName} ${browserVersion}`;
    }

    again.addEventListener("click", () => {
      if (quietMessage.classList.contains("active")) {
        if (!returnMessageActive) {
          showScaryReturnMessage();
        }
      } else {
        stopScareSound();
        prayAudio.pause();
        prayAudio.currentTime = 0;
        video.pause();
        video.currentTime = 0;
        video.muted = false;
        video.load();
        entry.classList.remove("hidden");
        videoStage.classList.remove("active");
        jumpscare.classList.remove("active");
        fallback.classList.remove("visible");
        again.classList.remove("visible");
      }
    });
  </script>
</body>
</html>
